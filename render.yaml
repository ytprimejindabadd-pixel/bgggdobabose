services:
  - type: web
    name: icmr-phone-lookup
    runtime: python
    plan: starter        # $7/mo — free tier OOM karega
    region: singapore    # India ke paas
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: HF_TOKEN
        sync: false      # Render dashboard me manually daalo
      - key: SOURCE_REPO
        value: mukeshcmdbrowser/icrm-hitek-fulldb
      - key: INDEX_REPO
        value: Bhatiasab/icmr-phone-locator-private
      - key: LEADING_DIGITS
        value: "9"
      - key: PYTHON_VERSION
        value: "3.11.9"
